[package]
name = "joffice-shell"
version = "0.1.0"
edition = "2021"
description = "jOffice native shell: GTK4 + WebKitGTK 6.0 hosting the Euro-Office web-apps editor"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_8"] }
webkit6 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
